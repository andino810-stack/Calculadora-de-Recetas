<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

<div class="container">

    <h1>Calculadora</h1>

    <div class="card">

        <label for="receta">Seleccionar receta:</label>

        <select id="receta" onchange="actualizarCampo()">

            <option value="mutabal">Mutabal</option>

            <option value="hummus">Hummus</option>

            <option value="tabule">Tabulé</option>

            <option value="nino">Niño envuelto</option>

        </select>


        <label for="pesoBase" id="labelPeso">
            Peso de la berenjena:
        </label>

        <input
            type="number"
            id="pesoBase"
            placeholder="Ej: 995"
            step="1"
            min="1"
        >


        <button onclick="calcular()">
            Calcular
        </button>

    </div>


    <div id="resultado" class="card resultado"></div>


    <footer class="footer">

        © 2026 Recetarios - Todos los derechos reservados.

        <br>

        Desarrollado por Matías Andino.

    </footer>

</div>


<script src="/script.js"></script>

</body>
</html>
